name: NativePHP Mobile Build
description: Community GitHub Action for building NativePHP Mobile Android applications.
author: mrpunyapal
branding:
  icon: smartphone
  color: pink

inputs:
  platform:
    description: Target platform. The first release supports Android only.
    required: false
    default: android
  build-type:
    description: debug creates a temporary-key development APK, release creates a signed APK, bundle creates a signed AAB.
    required: false
    default: release
  working-directory:
    description: Directory containing the Laravel NativePHP application.
    required: false
    default: .
  php-version:
    description: PHP version passed to setup-php.
    required: false
    default: '8.4'
  node-version:
    description: Node.js version passed to setup-node.
    required: false
    default: '22'
  java-version:
    description: Java version used by the Android Gradle build.
    required: false
    default: '17'
  android-api-level:
    description: Android platform SDK installed for the build.
    required: false
    default: '36'
  android-build-tools:
    description: Android build-tools version installed for the build.
    required: false
    default: '36.0.0'
  android-ndk:
    description: Android NDK version required by the NativePHP Android template.
    required: false
    default: 27.0.12077973
  keystore:
    description: Base64-encoded Android JKS/keystore content. Store it in GitHub Secrets.
    required: false
  keystore-password:
    description: Android keystore password.
    required: false
  key-alias:
    description: Android signing key alias.
    required: false
  key-password:
    description: Android signing key password.
    required: false

outputs:
  artifact:
    description: Absolute path to the generated APK or AAB.
    value: ${{ steps.artifact.outputs.artifact }}

runs:
  using: composite
  steps:
    - name: Validate NativePHP build inputs
      shell: bash
      env:
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_BUILD_TYPE: ${{ inputs.build-type }}
        INPUT_KEYSTORE: ${{ inputs.keystore }}
        INPUT_KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        INPUT_KEY_ALIAS: ${{ inputs.key-alias }}
        INPUT_KEY_PASSWORD: ${{ inputs.key-password }}
      run: node "${{ github.action_path }}/scripts/validate.mjs"

    - name: Set up PHP
      uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: mbstring, intl, zip, pcntl, pdo_sqlite
        tools: composer:v2
        coverage: none

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Set up Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Set up Android SDK
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      with:
        packages: platform-tools

    - name: Install Android build dependencies
      shell: bash
      env:
        ANDROID_API_LEVEL: ${{ inputs.android-api-level }}
        ANDROID_BUILD_TOOLS: ${{ inputs.android-build-tools }}
        ANDROID_NDK: ${{ inputs.android-ndk }}
      run: |
        set -euo pipefail
        echo "NativePHP Build"
        echo "Platform: android"
        echo "Build type: ${{ inputs.build-type }}"
        echo "Installing Android platform $ANDROID_API_LEVEL, build-tools $ANDROID_BUILD_TOOLS, NDK $ANDROID_NDK..."
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager \
          "platforms;android-${ANDROID_API_LEVEL}" \
          "build-tools;${ANDROID_BUILD_TOOLS}" \
          "cmake;3.22.1" \
          "ndk;${ANDROID_NDK}"

    - name: Install application dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        echo "Installing Composer dependencies..."
        composer install --no-interaction --prefer-dist --no-progress
        if [ -f package-lock.json ]; then
          echo "Installing npm dependencies..."
          npm ci
        elif [ -f package.json ]; then
          echo "Installing npm dependencies from package.json..."
          npm install --no-audit --no-fund
        fi
        if node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)" 2>/dev/null; then
          echo "Building frontend assets..."
          npm run build
        fi

    - name: Prepare NativePHP Android project
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        echo "Preparing NativePHP..."
        php artisan native:install android --force --no-interaction

    - name: Decode Android signing keystore
      if: ${{ inputs.build-type != 'debug' }}
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ inputs.keystore }}
      run: |
        set -euo pipefail
        key_path="$RUNNER_TEMP/nativephp-build-action.keystore"
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_path"
        test -s "$key_path"
        echo "NATIVEPHP_BUILD_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"

    - name: Generate temporary development keystore
      if: ${{ inputs.build-type == 'debug' }}
      shell: bash
      run: |
        set -euo pipefail
        key_path="$RUNNER_TEMP/nativephp-build-action.keystore"
        keytool -genkeypair -v \
          -keystore "$key_path" \
          -storepass changeit \
          -keypass changeit \
          -alias nativephp-development \
          -keyalg RSA \
          -keysize 2048 \
          -validity 1 \
          -dname "CN=NativePHP Development"
        echo "NATIVEPHP_BUILD_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
        echo "NATIVEPHP_BUILD_KEYSTORE_PASSWORD=changeit" >> "$GITHUB_ENV"
        echo "NATIVEPHP_BUILD_KEY_ALIAS=nativephp-development" >> "$GITHUB_ENV"
        echo "NATIVEPHP_BUILD_KEY_PASSWORD=changeit" >> "$GITHUB_ENV"

    - name: Build NativePHP Android application
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_BUILD_TYPE: ${{ inputs.build-type }}
        INPUT_KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        INPUT_KEY_ALIAS: ${{ inputs.key-alias }}
        INPUT_KEY_PASSWORD: ${{ inputs.key-password }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/nativephp-artifacts"
        export ANDROID_KEYSTORE_FILE="$NATIVEPHP_BUILD_KEYSTORE_PATH"
        if [ "$INPUT_BUILD_TYPE" = "debug" ]; then
          export ANDROID_KEYSTORE_PASSWORD="$NATIVEPHP_BUILD_KEYSTORE_PASSWORD"
          export ANDROID_KEY_ALIAS="$NATIVEPHP_BUILD_KEY_ALIAS"
          export ANDROID_KEY_PASSWORD="$NATIVEPHP_BUILD_KEY_PASSWORD"
          package_build_type=release
        else
          export ANDROID_KEYSTORE_PASSWORD="$INPUT_KEYSTORE_PASSWORD"
          export ANDROID_KEY_ALIAS="$INPUT_KEY_ALIAS"
          export ANDROID_KEY_PASSWORD="$INPUT_KEY_PASSWORD"
          package_build_type="$INPUT_BUILD_TYPE"
        fi
        echo "Building Android application..."
        php artisan native:package android \
          --build-type="$package_build_type" \
          --output="$RUNNER_TEMP/nativephp-artifacts" \
          --no-tty \
          --no-interaction

    - name: Print NativePHP build diagnostics
      if: ${{ failure() }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set +e
        if [ -f nativephp/android-build.log ]; then
          echo '--- nativephp/android-build.log ---'
          cat nativephp/android-build.log
        fi
        find nativephp -maxdepth 4 -type f \( -name '*.log' -o -name 'composer-*.json' \) -print 2>/dev/null

    - name: Locate Android artifact
      id: artifact
      shell: bash
      env:
        BUILD_TYPE: ${{ inputs.build-type }}
        ARTIFACT_DIRECTORY: ${{ runner.temp }}/nativephp-artifacts
      run: node "${{ github.action_path }}/scripts/find-artifact.mjs"

    - name: Remove temporary signing material
      if: ${{ always() }}
      shell: bash
      run: rm -f "$RUNNER_TEMP/nativephp-build-action.keystore"
